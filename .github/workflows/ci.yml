name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Detect Python sources
        id: detect
        shell: bash
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Python sources yet
        if: steps.detect.outputs.has_python == 'false'
        run: |
          echo "구현 단계(Coding 서브에이전트) 산출물이 아직 없어 코드 품질 게이트를 건너뜁니다."
          echo "Python 소스가 추가되면 이 워크플로우가 자동으로 lint/복잡도/중복/커버리지 게이트를 적용합니다."

      - name: Install quality tools
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install flake8 radon xenon coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # CLAUDE.md 구현 지침: 정적 분석
      - name: Lint (flake8)
        if: steps.detect.outputs.has_python == 'true'
        run: flake8 .

      # CLAUDE.md 구현 지침: 함수 순환복잡도 10 이하
      - name: Cyclomatic complexity gate (<=10 per function)
        if: steps.detect.outputs.has_python == 'true'
        run: xenon --max-absolute B --max-modules B --max-average B .

      # CLAUDE.md 구현 지침: 중복 코드 7라인까지 허용(8라인 이상 결함)
      - name: Duplicate code gate (>=8 lines fails)
        if: steps.detect.outputs.has_python == 'true'
        run: npx --yes jscpd --min-lines 8 --threshold 0 --reporters console .

      # CLAUDE.md 단위 테스트 지침: TDD(unittest) 기반, branch coverage 100%, 테스트 성공률 100%
      - name: Unit tests with branch coverage
        if: steps.detect.outputs.has_python == 'true'
        run: |
          coverage run --branch -m unittest discover -v
          coverage report -m --fail-under=100
